[project]
name = "thaichar"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.32.0",
    "imagehash>=4.3.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "timm>=1.0.29",
    "tqdm>=4.70.1",
]

# ---- PyTorch backend is chosen with an extra:  uv sync --extra cpu   (laptop / Colab-less CPU)
#                                                uv sync --extra cu126 (NVIDIA GPU, e.g. RTX 4060 on WSL2/Windows)
[project.optional-dependencies]
cpu = ["torch>=2.14.0", "torchvision>=0.29.0"]
cu126 = ["torch>=2.14.0", "torchvision>=0.29.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu126", extra = "cu126" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thaichar"]
