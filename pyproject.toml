[project]
name = "thaichar"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=5.0.1",
    "huggingface-hub>=1.32.0",
    "imagehash>=4.3.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

# ---- PyTorch wheel selection is automatic via environment markers (no flags to remember):
#   native Windows or WSL2 (kernel release contains "microsoft")  -> CUDA 12.6 wheels (RTX 4060 etc.)
#   any other Linux (this laptop, Colab CPU boxes)                -> CPU wheels
# Override on a Linux GPU box: `uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126`
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32' or 'microsoft' in platform_release" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32' and 'microsoft' not in platform_release" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32' or 'microsoft' in platform_release" },
  { index = "pytorch-cpu", marker = "sys_platform != 'win32' and 'microsoft' not in platform_release" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thaichar"]
