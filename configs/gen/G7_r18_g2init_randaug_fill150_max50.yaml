# Selective tail-fill (2026-09-22, owner's proposal): top up ONLY the genuinely starved classes
# instead of every class dataUpdate covers. G5 filled all 35 to 500 and made them 75-99 % synthetic
# (median 93.8 %), which cost 1.1 pt of robustness and 1.0 pt of doc macro-F1 -- the classes with
# 50-155 real images did not need help and were swamped.
# This variant fills only classes with <= 50 real training images, up to 150.
exp_id: G7_r18_g2init_randaug_fill150_max50
img_size: 64
epochs: 20
batch_size: 128
loss: ce
label_smoothing: 0.1
sampler: none
ema: true
lr: 0.001
warmup_epochs: 1.0
subset_frac: 1.0
tta: false
val_subset_frac: 0.5
init_from: weights/thaichar72_r18_synth203du_pretrain_init.pt
model: resnet18
aug: randaug
split_file: data/splits/split_seed42_v2.csv
extra_train_index: data/dataupdate/index_train_dj.csv
extra_train_cache: data/dataupdate/glyphs_train_dj.npz
extra_mode: fill
extra_fill_to: 150
extra_fill_max_real: 50
