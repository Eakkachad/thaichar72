# Stage 2 + tail-fill: on top of the best stage-1 init, top every starved class up to 500 images
# with dataUpdate synthetics DURING fine-tuning. Tests whether synthetic helps beyond pretraining.
# Validation stays 100% real, so the metric is not inflated by the added data.
exp_id: G5_r18_g2init_randaug_fill500_20
img_size: 64
epochs: 20
batch_size: 128
loss: ce
label_smoothing: 0.1
sampler: none
ema: true
lr: 0.001
warmup_epochs: 1.0
subset_frac: 1.0
tta: false
val_subset_frac: 0.5
init_from: runs/G2_synth203du_pretrain_r18_64/best.pt
model: resnet18
aug: randaug
split_file: data/splits/split_seed42_v2.csv
extra_train_index: data/dataupdate/index_train_dj.csv
extra_train_cache: data/dataupdate/glyphs_train_dj.npz
extra_mode: fill
extra_fill_to: 500
