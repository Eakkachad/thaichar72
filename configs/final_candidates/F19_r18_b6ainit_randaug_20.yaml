# Added 2026-09-19 on the RTX 4060: randaug (N=2 ops incl. speckle/blur/erase) gave the most robust F run (F2) but
# F2 used the plain ImageNet init; this pairs it with the synthetic-font pretrain init that helped F14-F16.
exp_id: F19_r18_b6ainit_randaug_20
img_size: 64
epochs: 20
batch_size: 128
loss: ce
label_smoothing: 0.1
sampler: none
ema: true
lr: 0.001
warmup_epochs: 1.0
subset_frac: 1.0
tta: true
val_subset_frac: 0.5
init_from: runs/B6a_synth_pretrain_resnet18_64/best.pt
model: resnet18
aug: randaug
