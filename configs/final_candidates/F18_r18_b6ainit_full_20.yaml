# Added 2026-09-19 on the RTX 4060 after the robustness gate: morph-based recipes (F16/F7) are the most robust to
# geometric corruptions but collapse on salt-pepper / background noise because `morph` has no noise op, while
# trivial/randaug recipes saw noise. `full` = morph + elastic + speckle + blur + erase + rebinarize. B6a_ft (same recipe,
# 6 ep) was the best 6-epoch run (0.9792 / 0.9843) and generalised to the doc split (+1.5 bal vs ImageNet init).
exp_id: F18_r18_b6ainit_full_20
img_size: 64
epochs: 20
batch_size: 128
loss: ce
label_smoothing: 0.1
sampler: none
ema: true
lr: 0.001
warmup_epochs: 1.0
subset_frac: 1.0
tta: true
val_subset_frac: 0.5
init_from: runs/B6a_synth_pretrain_resnet18_64/best.pt
model: resnet18
aug: full
