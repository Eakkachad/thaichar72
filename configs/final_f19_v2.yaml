# Original header: Final recipe (winner of HANDOFF 3.3 on 2026-09-19): F19 = ImageNet -> synthetic-font pretrain (B6a) -> real data,
# RandAugment N=2 (no flips), CE+LS 0.1, AdamW cosine, EMA, 20 epochs, 64 px, trained on the label-corrected split
# (data/splits/split_seed42_v2.csv, see reports/02-EXPERIMENTS.md section H). TTA off for the deliverable.
exp_id: final_r18_b6ainit_randaug_20_v2
img_size: 64
epochs: 20
batch_size: 128
loss: ce
label_smoothing: 0.1
sampler: none
ema: true
lr: 0.001
warmup_epochs: 1.0
subset_frac: 1.0
tta: false
val_subset_frac: 0.5
init_from: runs/B6a_synth_pretrain_resnet18_64/best.pt
model: resnet18
aug: randaug
split_file: data/splits/split_seed42_v2.csv
