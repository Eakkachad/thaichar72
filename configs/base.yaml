# Every engine default (regenerated from thaichar.engine.DEFAULTS). Copy a section and override what you need.
exp_id: null    # defaults to the config stem
out_root: runs
seed: 42
device: auto    # auto | cpu | cuda  (use cuda on GPU boxes to fail fast)
threads: 4
num_workers: 2    # 0 on Windows, 2 elsewhere (WSL2/Linux: 4 is a good choice)
channels_last: true
split_file: data/splits/split_seed42.csv
split_kind: strat    # strat | doc
cache: data/cache/glyphs.npz
subset_frac: 1.0
img_size: 64
channel_mode: gray3    # gray3 | gray1 | onoff
margin: 0.1
aug: none    # none | base | morph | full | randaug | trivial (never flips)
extra_train_index: null
extra_train_cache: null
extra_mode: all    # all | fill
extra_fill_to: 200
# fill ONLY classes whose REAL train count is <= this (null = every class the extra set covers).
# Topping up a class that already has real data swamps it: extra_fill_to=500 with no cap turned all 35
# dataUpdate classes 75-99 % synthetic (median 93.8 %) and cost 1.1 pt of robustness (G5, section L of
# reports/02-EXPERIMENTS.md). Set this to top up only the genuinely starved classes.
extra_fill_max_real: null
extra_max_per_class: null
use_real_train: true
init_from: null    # runs/<exp>/best.pt: loads all shape-compatible tensors
kd_teachers: null    # list of best.pt paths (64 px, same channel_mode) for distillation
kd_alpha: 0.7
kd_T: 4.0
model: resnet18
pretrained: true
mode: full    # full | partial | frozen
partial_frac: 0.35
geometry: false
drop_rate: 0.1
epochs: 6
batch_size: 128
lr: 0.001
weight_decay: 0.05
warmup_epochs: 1.0
min_lr_ratio: 0.01
llrd: null
grad_clip: 1.0
ema: true
ema_decay: 0.999
ema_eval: last    # last | every
amp: true
loss: ce    # ce | weighted_ce | focal | cb_focal
label_smoothing: 0.1
focal_gamma: 2.0
ce_weight_power: 0.5
cb_beta: 0.999
sampler: none    # none | sqrt_inv | inv
sampler_cap: 10.0
mixup: 0.0
cutmix: 0.0
mix_prob: 1.0
select_metric: balanced_acc
val_subset_frac: 1.0    # per-epoch monitoring only; final metrics use the full val split
taus: [0.0, 0.25, 0.5, 0.75]
tta: false
latency_iters: 50
save_last: true
